<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #202020;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>

    <!-- Import maps -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
            "@thatopen/components": "https://unpkg.com/@thatopen/components@2.4.0/dist/index.mjs",
            "@thatopen/fragments": "https://unpkg.com/@thatopen/fragments@2.4.0/dist/index.mjs",
            "web-ifc": "https://unpkg.com/web-ifc@0.0.68/web-ifc-api.js"
        }
    }
    </script>
</head>

<body>

<div id="canvas-container"></div>

<script type="module">

    import * as THREE from "three";
    import * as OBC from "@thatopen/components";

    // ------------------------------------------------------------
    // CONFIGURATION
    // ------------------------------------------------------------

    // IFC file stored inside your GitHub repository.
    //
    // Example repository structure:
    //
    // /
    // ├── index.html
    // └── models/
    //     └── model.ifc
    //
    const IFC_URL = "./models/SH-00041-Shed House.ifc";


    // ------------------------------------------------------------
    // HTML ELEMENTS
    // ------------------------------------------------------------

    const container =
        document.getElementById("canvas-container");

    // ------------------------------------------------------------
    // COMPONENTS
    // ------------------------------------------------------------

    const components = new OBC.Components();


    // ------------------------------------------------------------
    // SCENE
    // ------------------------------------------------------------

    const worlds = components.get(OBC.Worlds);
    const world = worlds.create();

    world.scene = new OBC.SimpleScene(components);
    world.renderer = new OBC.SimpleRenderer(components, container);
    world.camera = new OBC.SimpleCamera(components);

    components.init();
    world.scene.setup();
    world.scene.three.background = new THREE.Color(0x202020);


    // ------------------------------------------------------------
    // IFC LOADER
    // ------------------------------------------------------------

    const fragments = components.get(OBC.FragmentsManager);
    const fragmentIfcLoader = components.get(OBC.IfcLoader);


    // ------------------------------------------------------------
    // SETUP IFC WASM
    // ------------------------------------------------------------

    await fragmentIfcLoader.setup({
        autoSetWasm: false,
        wasm: {
            path: "https://unpkg.com/web-ifc@0.0.68/",
            absolute: true
        }
    });


    // ------------------------------------------------------------
    // LOAD IFC FROM URL
    // ------------------------------------------------------------

    async function loadIFCFromURL(url) {
        try {

            console.log("Loading IFC:");
            console.log(url);

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}: ${response.statusText}`
                );
            }

            const arrayBuffer =
                await response.arrayBuffer();

            const uint8Array =
                new Uint8Array(arrayBuffer);


            // Remove previous model
            fragments.dispose();


            // Load IFC
            const model =
                await fragmentIfcLoader.load(
                    uint8Array
                );


            // Add model to scene
            world.scene.three.add(model);


            // Fit camera
            await world.camera.controls.fitToBox(model);


            console.log(
                "IFC model loaded successfully."
            );

        }
        catch (error) {

            console.error(
                "IFC loading error:",
                error
            );

            console.error(
                "Unable to load IFC model:",
                error.message
            );
        }
    }


    // ------------------------------------------------------------
    // AUTOMATICALLY LOAD REPOSITORY IFC
    // ------------------------------------------------------------

    await loadIFCFromURL(IFC_URL);

</script>

</body>
</html>

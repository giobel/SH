```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #202020;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.80);
            padding: 15px;
            border-radius: 8px;
            color: white;
            min-width: 260px;
        }

        #controls h2 {
            margin-bottom: 8px;
        }

        #loading {
            margin-top: 10px;
            color: #ffeb3b;
            font-weight: bold;
        }

        #error {
            margin-top: 10px;
            color: #ff5555;
            display: none;
        }

        input[type="file"] {
            margin-top: 10px;
            color: #ccc;
            width: 100%;
        }
    </style>

    <!-- Import maps -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "@thatopen/components": "https://cdn.jsdelivr.net/npm/@thatopen/components@2.4.0/+esm",
            "@thatopen/fragments": "https://cdn.jsdelivr.net/npm/@thatopen/fragments@3.1.0/+esm"
        }
    }
    </script>
</head>

<body>

<div id="controls">
    <h2>IFC Viewer</h2>

    <div id="loading">
        Loading IFC model...
    </div>

    <input
        type="file"
        id="ifc-file"
        accept=".ifc"
    >

    <div id="error"></div>
</div>

<div id="canvas-container"></div>

<script type="module">

    import * as THREE from "three";
    import * as OBC from "@thatopen/components";

    // ------------------------------------------------------------
    // CONFIGURATION
    // ------------------------------------------------------------

    // IFC file stored inside your GitHub repository.
    //
    // Example repository structure:
    //
    // /
    // ├── index.html
    // └── models/
    //     └── model.ifc
    //
    const IFC_URL = "./models/SH-00041-Shed House.ifc";


    // ------------------------------------------------------------
    // HTML ELEMENTS
    // ------------------------------------------------------------

    const container =
        document.getElementById("canvas-container");

    const fileInput =
        document.getElementById("ifc-file");

    const loadingIndicator =
        document.getElementById("loading");

    const errorElement =
        document.getElementById("error");


    // ------------------------------------------------------------
    // COMPONENTS
    // ------------------------------------------------------------

    const components = new OBC.Components();


    // ------------------------------------------------------------
    // SCENE
    // ------------------------------------------------------------

    const worlds = components.get(OBC.Worlds);
    const world = worlds.create();

    world.scene = new OBC.SimpleScene(components);
    world.renderer = new OBC.SimpleRenderer(components, container);
    world.camera = new OBC.SimpleCamera(components);

    components.init();
    world.scene.setup();
    world.scene.three.background = new THREE.Color(0x202020);


    // ------------------------------------------------------------
    // IFC LOADER
    // ------------------------------------------------------------

    const fragments = components.get(OBC.FragmentsManager);
    const fragmentIfcLoader = components.get(OBC.IfcLoader);


    // ------------------------------------------------------------
    // SETUP IFC WASM
    // ------------------------------------------------------------

    await fragmentIfcLoader.setup({
        wasm: {
            path: "https://cdn.jsdelivr.net/npm/web-ifc@0.0.68/",
            absolute: true
        }
    });


    // ------------------------------------------------------------
    // LOAD IFC FROM URL
    // ------------------------------------------------------------

    async function loadIFCFromURL(url) {

        loadingIndicator.style.display = "block";
        errorElement.style.display = "none";

        try {

            console.log("Loading IFC:");
            console.log(url);

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}: ${response.statusText}`
                );
            }

            const arrayBuffer =
                await response.arrayBuffer();

            const uint8Array =
                new Uint8Array(arrayBuffer);


            // Remove previous model
            fragments.dispose();


            // Load IFC
            const model =
                await fragmentIfcLoader.load(
                    uint8Array
                );


            // Add model to scene
            world.scene.three.add(model);


            // Fit camera
            world.camera.fitToItems();


            console.log(
                "IFC model loaded successfully."
            );

        }
        catch (error) {

            console.error(
                "IFC loading error:",
                error
            );

            errorElement.innerText =
                "Unable to load IFC model: " +
                error.message;

            errorElement.style.display =
                "block";
        }

        finally {

            loadingIndicator.style.display =
                "none";
        }
    }


    // ------------------------------------------------------------
    // LOCAL IFC FILE
    // ------------------------------------------------------------

    fileInput.addEventListener(
        "change",
        async (event) => {

            const file =
                event.target.files[0];

            if (!file)
                return;

            loadingIndicator.style.display =
                "block";

            errorElement.style.display =
                "none";

            try {

                const buffer =
                    await file.arrayBuffer();

                const uint8Array =
                    new Uint8Array(buffer);


                fragments.dispose();


                const model =
                    await fragmentIfcLoader.load(
                        uint8Array
                    );


                world.scene.three.add(model);
                world.camera.fitToItems();

            }
            catch (error) {

                console.error(error);

                errorElement.innerText =
                    "Unable to load IFC model: " +
                    error.message;

                errorElement.style.display =
                    "block";
            }

            finally {

                loadingIndicator.style.display =
                    "none";
            }
        }
    );


    // ------------------------------------------------------------
    // AUTOMATICALLY LOAD REPOSITORY IFC
    // ------------------------------------------------------------

    await loadIFCFromURL(IFC_URL);

</script>

</body>
</html>
```

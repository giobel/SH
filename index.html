<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #e3eef3;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        #turntable-button {
            border: 0;
            border-radius: 34px;
            padding: 8px 20px;
            color: #4b555b;
            background: transparent;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
        }

        #turntable-button:hover,
        #turntable-button[aria-pressed="true"] {
            color: #16a9e5;
            background: #eefaff;
        }

        #turntable-button::before {
            content: "\21BB";
            display: block;
            margin-bottom: 2px;
            font-size: 22px;
            line-height: 20px;
        }

        #show-all-button {
            border: 0;
            border-radius: 34px;
            padding: 8px 20px;
            color: #4b555b;
            background: transparent;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
        }

        #show-all-button:hover {
            color: #16a9e5;
            background: #eefaff;
        }

        #show-all-button::before {
            content: "\21BA";
            display: block;
            margin-bottom: 2px;
            font-size: 22px;
            line-height: 20px;
        }

        #turntable-speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 220px;
            height: 38px;
            padding: 0 14px;
            border-left: 1px solid #dce1e4;
            color: #4b555b;
            background: transparent;
        }

        #viewer-controls {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 74px;
            padding: 10px 20px;
            border-bottom: 1px solid #d9dfe2;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 -2px 8px rgba(39, 52, 59, 0.12);
        }

        #turntable-speed-label {
            flex: 0 0 auto;
            font-weight: 600;
            font-size: 12px;
        }

        #turntable-speed {
            flex: 1;
            width: 100%;
            accent-color: #55b8ff;
        }

        #loading-overlay {
            position: absolute;
            top: 94px;
            left: 50%;
            z-index: 10;
            width: min(320px, calc(100vw - 40px));
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            transform: translateX(-50%);
        }

        #loading-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        #loading-track {
            width: 100%;
            height: 6px;
            overflow: hidden;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
        }

        #loading-progress {
            width: 0%;
            height: 100%;
            background: #55b8ff;
            transition: width 120ms ease-out;
        }

        #loading-progress.indeterminate {
            width: 45%;
            animation: loading-slide 1.1s ease-in-out infinite;
        }

        @keyframes loading-slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(230%); }
        }
    </style>

    <!-- Import maps -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
            "@thatopen/components": "https://unpkg.com/@thatopen/components@2.4.0/dist/index.mjs",
            "@thatopen/fragments": "https://unpkg.com/@thatopen/fragments@2.4.0/dist/index.mjs",
            "web-ifc": "https://unpkg.com/web-ifc@0.0.68/web-ifc-api.js"
        }
    }
    </script>
</head>

<body>

<div id="canvas-container"></div>
<div id="viewer-controls">
    <button id="show-all-button" type="button">
        Show all elements
    </button>
    <button id="turntable-button" type="button" aria-pressed="false">
        Start turntable
    </button>
    <label id="turntable-speed-control" for="turntable-speed">
        <span id="turntable-speed-label">Turntable speed: 1.0x</span>
        <input id="turntable-speed" type="range" min="0.1" max="1" step="0.1" value="1">
    </label>
</div>
<div id="loading-overlay" role="status" aria-live="polite">
    <span id="loading-label">Loading model...</span>
    <div id="loading-track">
        <div id="loading-progress"></div>
    </div>
</div>

<script type="module">

    import * as THREE from "three";
    import * as OBC from "@thatopen/components";

    // ------------------------------------------------------------
    // CONFIGURATION
    // ------------------------------------------------------------

    // IFC file stored inside your GitHub repository.
    //
    // Example repository structure:
    //
    // /
    // ├── index.html
    // └── models/
    //     └── model.ifc
    //
    const IFC_URL = "./models/SH-00041-Shed House.ifc";

    const wallNamePattern =
        /external wall|exterior wall|external|exterior|facade|cladding|siding/i;

    const nonWallNamePattern =
        /floor|slab|roof|ceiling|soffit|interior|partition|door|window/i;


    // ------------------------------------------------------------
    // HTML ELEMENTS
    // ------------------------------------------------------------

    const container =
        document.getElementById("canvas-container");

    const turntableButton =
        document.getElementById("turntable-button");

    const showAllButton =
        document.getElementById("show-all-button");

    const turntableSpeed =
        document.getElementById("turntable-speed");

    const turntableSpeedLabel =
        document.getElementById("turntable-speed-label");

    const loadingOverlay =
        document.getElementById("loading-overlay");

    const loadingLabel =
        document.getElementById("loading-label");

    const loadingProgress =
        document.getElementById("loading-progress");

    function createCladdingTexture() {
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        const ridgeWidth = 24;

        canvas.width = ridgeWidth * 4;
        canvas.height = 128;

        const baseGradient = context.createLinearGradient(0, 0, canvas.width, 0);
        baseGradient.addColorStop(0, "#9daab0");
        baseGradient.addColorStop(0.5, "#e3e8ea");
        baseGradient.addColorStop(1, "#8c999f");
        context.fillStyle = baseGradient;
        context.fillRect(0, 0, canvas.width, canvas.height);

        for (let x = 0; x < canvas.width; x += ridgeWidth) {
            const ridgeGradient = context.createLinearGradient(x, 0, x + ridgeWidth, 0);
            ridgeGradient.addColorStop(0, "rgba(35, 45, 50, 0.32)");
            ridgeGradient.addColorStop(0.28, "rgba(255, 255, 255, 0.42)");
            ridgeGradient.addColorStop(0.55, "rgba(225, 232, 235, 0.08)");
            ridgeGradient.addColorStop(1, "rgba(35, 45, 50, 0.28)");
            context.fillStyle = ridgeGradient;
            context.fillRect(x, 0, ridgeWidth, canvas.height);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(12, 4);
        texture.anisotropy = 4;

        return texture;
    }

    const claddingTexture = createCladdingTexture();

    let turntableActive = false;
    let turntableRotationSpeed = Number(turntableSpeed.value);
    const hiddenObjects = new Set();
    let loadedModel = null;

    function animateTurntable() {
        if (turntableActive) {
            world.camera.controls.rotate(
                0.01 * turntableRotationSpeed,
                0,
                false
            );
        }

        requestAnimationFrame(animateTurntable);
    }

    turntableButton.addEventListener("click", () => {
        turntableActive = !turntableActive;
        turntableButton.setAttribute("aria-pressed", turntableActive);
        turntableButton.textContent = turntableActive
            ? "Stop turntable"
            : "Start turntable";
    });

    turntableSpeed.addEventListener("input", () => {
        turntableRotationSpeed = Number(turntableSpeed.value);
        turntableSpeedLabel.textContent =
            `Turntable speed: ${turntableRotationSpeed.toFixed(1)}x`;
    });

    // ------------------------------------------------------------
    // COMPONENTS
    // ------------------------------------------------------------

    const components = new OBC.Components();


    // ------------------------------------------------------------
    // SCENE
    // ------------------------------------------------------------

    const worlds = components.get(OBC.Worlds);
    const world = worlds.create();

    world.scene = new OBC.SimpleScene(components);
    world.renderer = new OBC.SimpleRenderer(
        components,
        container,
        {
            antialias: true,
            powerPreference: "high-performance"
        }
    );
    world.camera = new OBC.SimpleCamera(components);

    components.init();
    world.scene.setup();
    world.scene.three.background = new THREE.Color(0xe3eef3);

    const renderer = world.renderer.three;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    world.scene.three.add(
        new THREE.HemisphereLight(0xf8fcff, 0x9da9ae, 1.05)
    );

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.55);
    keyLight.position.set(12, 18, 14);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(4096, 4096);
    keyLight.shadow.radius = 8;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.normalBias = 0.035;
    keyLight.shadow.camera.left = -50;
    keyLight.shadow.camera.right = 50;
    keyLight.shadow.camera.top = 50;
    keyLight.shadow.camera.bottom = -50;
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 120;
    world.scene.three.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xd8e9f5, 0.3);
    fillLight.position.set(-10, 8, -14);
    world.scene.three.add(fillLight);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener("contextmenu", (event) => {
        event.preventDefault();

        if (!loadedModel) {
            return;
        }

        const bounds = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
        pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

        raycaster.setFromCamera(pointer, world.camera.three);
        const intersections = raycaster.intersectObject(loadedModel, true);
        const selectedObject = intersections[0]?.object;

        if (selectedObject) {
            selectedObject.visible = false;
            hiddenObjects.add(selectedObject);
        }
    });

    showAllButton.addEventListener("click", () => {
        for (const object of hiddenObjects) {
            object.visible = true;
        }

        hiddenObjects.clear();
    });

    animateTurntable();


    // ------------------------------------------------------------
    // IFC LOADER
    // ------------------------------------------------------------

    const fragments = components.get(OBC.FragmentsManager);
    const fragmentIfcLoader = components.get(OBC.IfcLoader);


    // ------------------------------------------------------------
    // SETUP IFC WASM
    // ------------------------------------------------------------

    await fragmentIfcLoader.setup({
        autoSetWasm: false,
        wasm: {
            path: "https://unpkg.com/web-ifc@0.0.68/",
            absolute: true
        }
    });


    // ------------------------------------------------------------
    // LOAD IFC FROM URL
    // ------------------------------------------------------------

    async function loadIFCFromURL(url) {
        try {

            console.log("Loading IFC:");
            console.log(url);

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}: ${response.statusText}`
                );
            }

            const contentLength =
                Number(response.headers.get("content-length"));
            const reader = response.body?.getReader();
            const chunks = [];
            let bytesLoaded = 0;

            if (!reader || !contentLength) {
                loadingProgress.classList.add("indeterminate");
            }

            if (reader) {
                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        break;
                    }

                    chunks.push(value);
                    bytesLoaded += value.length;

                    if (contentLength) {
                        const percentage =
                            Math.round((bytesLoaded / contentLength) * 100);

                        loadingProgress.style.width = `${percentage}%`;
                        loadingLabel.textContent =
                            `Loading model... ${percentage}%`;
                    }
                }
            } else {
                const arrayBuffer = await response.arrayBuffer();
                const arrayBufferBytes = new Uint8Array(arrayBuffer);

                chunks.push(arrayBufferBytes);
                bytesLoaded = arrayBufferBytes.length;
            }

            const modelBytes = new Uint8Array(bytesLoaded);
            let offset = 0;

            for (const chunk of chunks) {
                modelBytes.set(chunk, offset);
                offset += chunk.length;
            }

            loadingProgress.classList.remove("indeterminate");
            loadingProgress.style.width = "100%";
            loadingLabel.textContent = "Preparing model...";


            // Remove previous model
            fragments.dispose();


            // Load IFC
            const model =
                await fragmentIfcLoader.load(
                    modelBytes
                );

            loadedModel = model;

            model.traverse((object) => {
                if (!object.isMesh || !object.material) {
                    return;
                }

                const materials = Array.isArray(object.material)
                    ? object.material
                    : [object.material];

                object.material = materials.map((material) => {
                    const graphicMaterial = material.clone();
                    const materialName = material.name.toLowerCase();

                    if (!/glass|window|door|frame/.test(materialName)) {
                        graphicMaterial.color?.lerp(new THREE.Color(0xffffff), 0.18);
                        graphicMaterial.metalness = 0;
                        graphicMaterial.roughness = 0.86;
                    }

                    graphicMaterial.needsUpdate = true;
                    return graphicMaterial;
                });

                if (!Array.isArray(object.material)) {
                    object.material = object.material[0];
                }

            });

            model.traverse((object) => {
                if (!object.material) {
                    return;
                }

                const materials = Array.isArray(object.material)
                    ? object.material
                    : [object.material];
                const objectName = `${object.name} ${materials.map((material) => material.name).join(" ")}`;

                if (
                    !wallNamePattern.test(objectName) ||
                    nonWallNamePattern.test(objectName)
                ) {
                    return;
                }

                const updatedMaterials = materials.map((material) => {
                    const claddingMaterial = material.clone();

                    claddingMaterial.map = claddingTexture;
                    claddingMaterial.color?.set("#ffffff");
                    claddingMaterial.metalness = 0.35;
                    claddingMaterial.roughness = 0.72;
                    claddingMaterial.onBeforeCompile = (shader) => {
                        shader.vertexShader = `varying vec3 vCladdingWorldPosition;\n${shader.vertexShader}`;
                        shader.vertexShader = shader.vertexShader.replace(
                            "#include <begin_vertex>",
                            "#include <begin_vertex>\n    vCladdingWorldPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;"
                        );
                        shader.fragmentShader = `varying vec3 vCladdingWorldPosition;\n${shader.fragmentShader}`;
                        shader.fragmentShader = shader.fragmentShader.replace(
                            "#include <color_fragment>",
                            "#include <color_fragment>\n    float claddingRidge = 0.5 + 0.5 * cos(vCladdingWorldPosition.x * 7.0);\n    float claddingHighlight = smoothstep(0.2, 0.8, claddingRidge);\n    diffuseColor.rgb *= mix(0.78, 1.12, claddingHighlight);"
                        );
                    };
                    claddingMaterial.needsUpdate = true;

                    return claddingMaterial;
                });

                object.material = Array.isArray(object.material)
                    ? updatedMaterials
                    : updatedMaterials[0];
            });

            // Add model to scene
            world.scene.three.add(model);


            // Fit camera
            await world.camera.controls.fitToBox(model);


            console.log(
                "IFC model loaded successfully."
            );

            loadingOverlay.style.display = "none";

        }
        catch (error) {

            console.error(
                "IFC loading error:",
                error
            );

            console.error(
                "Unable to load IFC model:",
                error.message
            );

            loadingLabel.textContent = "Unable to load model";
            loadingProgress.classList.remove("indeterminate");
            loadingProgress.style.background = "#ff5555";
        }
    }


    // ------------------------------------------------------------
    // AUTOMATICALLY LOAD REPOSITORY IFC
    // ------------------------------------------------------------

    await loadIFCFromURL(IFC_URL);

</script>

</body>
</html>
